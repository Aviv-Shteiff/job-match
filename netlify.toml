# Netlify builds the Vite client from client/ and serves client/dist.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# Proxy the API to the Render backend. status = 200 makes this a rewrite, so the
# browser only ever sees the Netlify origin and no CORS handling is needed on the
# server. :splat carries the rest of the path through (/api/analyses/123 ->
# https://job-match-v5ov.onrender.com/api/analyses/123).
[[redirects]]
  from = "/api/*"
  to = "https://job-match-v5ov.onrender.com/api/:splat"
  status = 200
  force = true
